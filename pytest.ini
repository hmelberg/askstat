[pytest]
# import-mode=importlib (plan 2026-07-27, pandas-url-bro Task 5): trengs fra
# og med da micropython/tests/test_read_csv_url.py fikk samme filnavn som
# brython/tests/test_read_csv_url.py (Task 4). Standard "prepend"-modus krever
# unike modulnavn på tvers av hele repoet uten __init__.py-pakker; importlib
# løser navnekollisjonen uten å røre noen testfil eller legge til pakker.
addopts = --import-mode=importlib
