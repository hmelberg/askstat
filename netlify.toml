# Faste dev-porter så askstat og openstat kan kjøre `netlify dev` samtidig på
# samme maskin (openstat bruker standardportene 8888/3999).
[dev]
  port = 8899
  staticServerPort = 3998
  autoLaunch = false

# The Python translator runner lives only at /py2m/. The old duplicate under
# /r2m/ was deleted (it shipped a stale copy of the whole py2m package); keep the
# URL working for any external bookmark.
[[redirects]]
  from = "/r2m/py2m_runner.html"
  to = "/py2m/py2m_runner.html"
  status = 301

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.py"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/variable_metadata.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/widgets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/command_help.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Content-Security-Policy-Report-Only (docs/REVIEW_2026-07-07.md §3, CSP item;
# allowlist completed in review 2026-10-10). Still OBSERVE-ONLY: browsers log
# violations but never block. Promoting it to an enforced
# "Content-Security-Policy" is a separate decision for the owner (see the
# 2026-10-10 review notes: verified with a local server + Playwright).
#
# Allowlist = every external host the app actually loads:
#   script-src: cdn.jsdelivr.net (pyodide, markdown-it, brython, duckdb-wasm
#     +esm, katex, tabulator, leaflet, arquero/d3/Plot/…, ipywidgets
#     embed-amd), cdn.plot.ly (Plotly), webr.r-wasm.org (webR, dynamic
#     import), cdnjs.cloudflare.com (require.js for the ipywidgets bridge),
#     www.lactame.com (ml.js in javascript mode), giscus.app (comments).
#   style-src: jsdelivr (tabulator/leaflet/katex CSS), giscus.app.
#   font-src: jsdelivr (KaTeX fonts).
#   frame-src: giscus.app (the comments iframe).
#   connect-src https: stays broad on purpose: scripts load user-chosen data
#     URLs, micropip talks to pypi.org/files.pythonhosted.org, webR to
#     repo.r-wasm.org, login/sync/telemetry to mdataapi.anvil.app, GitHub
#     save/share to api.github.com / raw.githubusercontent.com.
# Pyodide needs 'unsafe-eval'+'wasm-unsafe-eval'; DuckDB-WASM and webR spin
# up workers from blob: URLs; index.html ships inline <script>/style, so
# 'unsafe-inline' stays until nonces/hashes are introduced.
# frame-ancestors is ignored in Report-Only mode, so clickjacking protection
# comes from X-Frame-Options until the CSP is enforced.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net https://cdn.plot.ly https://webr.r-wasm.org https://cdnjs.cloudflare.com https://www.lactame.com https://giscus.app; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://giscus.app; img-src 'self' data: blob: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https: data: blob:; frame-src 'self' https://giscus.app; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

